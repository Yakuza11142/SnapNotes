name: snapnotes
description: Production mobile and web capture, summary, flashcard, and voice study app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^1.0.3
  flutter_tts: ^4.2.5
  speech_to_text: ^7.5.0
  path_provider: ^2.1.5
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  web:
    generate: true
    image_path: "assets_icon_snapnotes.png"
    background_color: "#0F766E"
    theme_color: "#0F766E"
  image_path: "assets_icon_snapnotes.png"
  adaptive_icon_background: "#0F766E"
  adaptive_icon_foreground: "assets_icon_snapnotes.png"
